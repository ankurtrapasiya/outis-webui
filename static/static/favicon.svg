<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Outis Mneme">
  <title>Outis Mneme</title>

  <!-- Black plate rather than a transparent background. With a black-and-green
       palette there is no single ink that survives both themes: black vanishes
       on GitHub's dark canvas, phosphor green washes out on white. Carrying our
       own ground makes the mark render identically everywhere, and a lit
       terminal is the right image anyway. -->
  <rect width="64" height="64" rx="13" fill="#0A0E0C"/>

  <!-- The Cyclops' eye, struck through. Odysseus escaped Polyphemus by calling
       himself Nobody; the rings are memory accumulating, like growth rings. -->
  <g fill="none" stroke="#00E676" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 32 C 18 20, 46 20, 54 32 C 46 44, 18 44, 10 32 Z" stroke-width="2.75"/>
    <circle cx="32" cy="32" r="8.5" stroke-width="2.25"/>
    <!-- The faint inner ring drops below a pixel under ~20px and fades out;
         the eye, iris and strike still carry the mark at favicon size. -->
    <circle cx="32" cy="32" r="5" stroke-width="1.5" opacity="0.5"/>
    <circle cx="32" cy="32" r="2" stroke="none" fill="#00E676"/>
  </g>

  <!-- Blinded: the one stroke that says nothing gets out. Knocked out against
       the plate first, so it reads as a cut rather than an overlay. -->
  <path d="M14 50 L50 14" stroke="#0A0E0C" stroke-width="7" stroke-linecap="round"/>
  <path d="M14 50 L50 14" stroke="#A7F3D0" stroke-width="3.25" stroke-linecap="round"/>
</svg>
